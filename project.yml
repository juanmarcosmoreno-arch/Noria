# XcodeGen specification for Noria. Regenerate the project with:
#   xcodegen generate
# Noria.xcodeproj is committed so the project opens without XcodeGen installed.
#
# Two editions share all sources:
#   Noria         — Mac App Store / TestFlight: App Sandbox + home-folder grant (default scheme).
#   Noria Direct  — direct distribution (Developer ID): not sandboxed.
name: Noria
options:
  bundleIdPrefix: com.juanmarcos
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    # Increase before every App Store Connect upload (each build number can be used once).
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  NoriaCore:
    path: NoriaCore
targetTemplates:
  NoriaApp:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: NoriaCore
    settings:
      base:
        PRODUCT_NAME: Noria
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Noria
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Juan Marcos Moreno"
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Noria looks for old installers and archives in Downloads. Nothing is removed without your confirmation."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Noria measures large files in Documents when you scan your home folder."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Noria measures large files on the Desktop when you scan your home folder."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "Noria measures large files on the volume you choose."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "Noria measures large files on the volume you choose."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 62395T6WLG
        ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Noria:
    templates: [NoriaApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juanmarcos.noria
        CODE_SIGN_ENTITLEMENTS: App/Resources/Noria-AppStore.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) NORIA_APP_STORE
  Noria Direct:
    templates: [NoriaApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juanmarcos.noria.direct
        CODE_SIGN_ENTITLEMENTS: App/Resources/Noria.entitlements
schemes:
  Noria:
    build:
      targets:
        Noria: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NoriaCore/NoriaCoreTests
    archive:
      config: Release
  Noria Direct:
    build:
      targets:
        Noria Direct: all
    run:
      config: Debug
    archive:
      config: Release
