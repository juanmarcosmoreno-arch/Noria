# XcodeGen specification for Noria. Regenerate the project with:
#   xcodegen generate
# Noria.xcodeproj is committed so the project opens without XcodeGen installed.
name: Noria
options:
  bundleIdPrefix: app.noria
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  NoriaCore:
    path: NoriaCore
targets:
  Noria:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: NoriaCore
    settings:
      base:
        # Provisional bundle identifier: confirm the final one before the first upload.
        PRODUCT_BUNDLE_IDENTIFIER: app.noria.Noria
        PRODUCT_NAME: Noria
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Noria
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Noria"
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Noria looks for old installers and archives in Downloads. Nothing is removed without your confirmation."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Noria measures large files in Documents when you scan your home folder."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Noria measures large files on the Desktop when you scan your home folder."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "Noria measures large files on the volume you choose."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "Noria measures large files on the volume you choose."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Resources/Noria.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 62395T6WLG
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Noria:
    build:
      targets:
        Noria: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NoriaCore/NoriaCoreTests
    archive:
      config: Release
